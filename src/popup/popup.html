<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="tabs">
        <button class="tab-btn active" data-tab="json">JSON</button>
        <button class="tab-btn" data-tab="base64">Base64</button>
        <button class="tab-btn" data-tab="jwt">JWT</button>
        <button class="tab-btn" data-tab="url">URL</button>
        <button class="tab-btn" data-tab="timestamp" data-i18n="tabTime">Time</button>
        <button class="tab-btn" data-tab="hash" data-i18n="tabHash">Hash</button>
        <button class="tab-btn" data-tab="uuid">UUID</button>
        <button class="tab-btn" data-tab="color" data-i18n="tabColor">Color</button>
        <button class="tab-btn" data-tab="diff" data-i18n="tabDiff">Diff</button>
      </div>
      <button id="theme-toggle">🌙</button>
    </div>
    
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="encode" data-i18n="modeEncode">Encode</button>
      <button class="mode-btn" data-mode="decode" data-i18n="modeDecode">Decode</button>
    </div>

    <div class="json-options" hidden>
      <select id="json-indent">
        <option value="2" data-i18n="indent2">2 spaces</option>
        <option value="4" data-i18n="indent4">4 spaces</option>
        <option value="tab" data-i18n="indentTab">Tab</option>
      </select>
      <button id="minify" class="minify-btn" data-i18n="minify">Minify</button>
    </div>

    <div class="content">
      <textarea id="input" data-i18n-placeholder="inputPlaceholder"></textarea>
      <div class="actions">
        <button id="format" class="primary" data-i18n="actionFormatJson">Format JSON</button>
        <button id="copy" data-i18n="copy">Copy</button>
        <button id="clear" data-i18n="clear">Clear</button>
      </div>
      <textarea id="output" readonly data-i18n-placeholder="outputPlaceholder"></textarea>
    </div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
